services:
  - type: web
    name: water-billing-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main_multitenant:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: DATA_BACKEND
        value: firestore
      - key: SMS_PROVIDER
        value: africas_talking
      - key: AFRICAS_TALKING_USERNAME
        sync: false
      - key: AFRICAS_TALKING_API_KEY
        sync: false
      - key: AFRICAS_TALKING_IS_SANDBOX
        value: "false"
      - key: AFRICAS_TALKING_SENDER_ID
        sync: false
    autoDeploy: false
